<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Editorial data-topology visualization with three clusters, one outlier, and one selected target point">
  <style>
    @media (max-width: 480px) {
      .annotation, .annotation-line { display: none; }
    }
  </style>
  <defs>
    <pattern id="ds-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F2F2F2" stroke-width="1" class="grid-line"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="620" height="440" fill="#FFFFFF"/>
  <rect x="48" y="20" width="540" height="360" fill="url(#ds-grid)"/>

  <!-- axes -->
  <g stroke="#111111" stroke-width="1.5" stroke-linecap="round">
    <line x1="48" y1="20" x2="48" y2="388"/>
    <line x1="40" y1="380" x2="596" y2="380"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#777777">
    <text x="300" y="412" text-anchor="middle">ROWS</text>
    <text x="22" y="200" text-anchor="middle" transform="rotate(-90 22 200)">FEATURES</text>
  </g>

  <!-- cluster 1: dense, upper-left -->
  <g fill="#171717" class="data-point">
    <circle cx="120" cy="110" r="3.5"/><circle cx="140" cy="100" r="3.5"/><circle cx="160" cy="115" r="3.5"/>
    <circle cx="130" cy="135" r="3.5"/><circle cx="155" cy="140" r="3.5"/><circle cx="175" cy="130" r="3.5"/>
    <circle cx="110" cy="150" r="3.5"/><circle cx="145" cy="160" r="3.5"/><circle cx="170" cy="155" r="3.5"/>
    <circle cx="125" cy="178" r="3.5"/><circle cx="190" cy="145" r="3.5"/><circle cx="200" cy="170" r="3.5"/>
    <circle cx="100" cy="128" r="3.5"/><circle cx="185" cy="105" r="3.5"/><circle cx="150" cy="190" r="3.5"/>
    <circle cx="215" cy="140" r="3.5"/>
  </g>

  <!-- cluster 2: mid, hollow -->
  <g fill="#FFFFFF" stroke="#666666" stroke-width="1.5" class="data-point">
    <circle cx="300" cy="215" r="4"/><circle cx="320" cy="205" r="4"/><circle cx="340" cy="220" r="4"/>
    <circle cx="310" cy="240" r="4"/><circle cx="335" cy="245" r="4"/><circle cx="355" cy="232" r="4"/>
    <circle cx="290" cy="258" r="4"/><circle cx="325" cy="262" r="4"/><circle cx="360" cy="255" r="4"/>
    <circle cx="345" cy="200" r="4"/><circle cx="375" cy="242" r="4"/>
  </g>

  <!-- cluster 3: sparse, lower-right -->
  <g fill="#666666" class="data-point">
    <circle cx="460" cy="315" r="3"/><circle cx="485" cy="305" r="3"/><circle cx="505" cy="325" r="3"/>
    <circle cx="475" cy="340" r="3"/><circle cx="500" cy="350" r="3"/><circle cx="525" cy="342" r="3"/>
    <circle cx="545" cy="320" r="3"/><circle cx="455" cy="355" r="3"/>
  </g>

  <!-- outlier -->
  <g class="data-point">
    <circle cx="548" cy="72" r="4.5" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
  </g>
  <line x1="552" y1="78" x2="572" y2="100" stroke="#B8B8B8" stroke-width="0.75" class="annotation-line"/>
  <text x="574" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#666666" class="annotation">OUTLIER</text>

  <!-- selected target point with crosshair -->
  <g class="node">
    <line x1="320" y1="186" x2="320" y2="196" stroke="#2563EB" stroke-width="1"/>
    <line x1="320" y1="234" x2="320" y2="244" stroke="#2563EB" stroke-width="1"/>
    <line x1="301" y1="215" x2="311" y2="215" stroke="#2563EB" stroke-width="1"/>
    <line x1="329" y1="215" x2="339" y2="215" stroke="#2563EB" stroke-width="1"/>
    <circle cx="320" cy="215" r="9" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="320" cy="215" r="2.5" fill="#2563EB"/>
  </g>
  <line x1="329" y1="208" x2="366" y2="182" stroke="#B8B8B8" stroke-width="0.75" class="annotation-line"/>
  <text x="368" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#2563EB" class="annotation">TARGET</text>

  <!-- density annotation: structural, no counts -->
  <text x="120" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#999999" class="annotation">DENSE</text>
  <text x="460" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#999999" class="annotation">SPARSE</text>
</svg>
