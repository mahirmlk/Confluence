<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Minimal decision-boundary visualization with two data classes separated by a single model boundary">
  <style>
    @media (max-width: 480px) {
      .annotation, .annotation-line, .model-label { display: none; }
    }
  </style>
  <defs>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F2F2F2" stroke-width="1" class="grid-line"/>
    </pattern>
    <marker id="hero-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="540" fill="#FFFFFF"/>
  <rect x="40" y="20" width="560" height="470" fill="url(#hero-grid)"/>

  <!-- probability regions: barely-there, structural only -->
  <path d="M 60 470 L 60 400 C 200 380, 240 280, 340 260 C 440 240, 470 160, 600 120 L 600 20 L 60 20 Z" fill="#111111" opacity="0.025"/>
  <path d="M 60 470 L 60 400 C 200 380, 240 280, 340 260 C 440 240, 470 160, 600 120 L 600 470 Z" fill="#2563EB" opacity="0.045"/>

  <!-- axes -->
  <line x1="60" y1="20" x2="60" y2="478" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="470" x2="608" y2="470" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="60,12 55,22 65,22" fill="#111111"/>
  <polygon points="616,470 606,465 606,475" fill="#111111"/>

  <!-- axis ticks -->
  <g stroke="#B8B8B8" stroke-width="1">
    <line x1="56" y1="120" x2="64" y2="120"/>
    <line x1="56" y1="220" x2="64" y2="220"/>
    <line x1="56" y1="320" x2="64" y2="320"/>
    <line x1="160" y1="466" x2="160" y2="474"/>
    <line x1="280" y1="466" x2="280" y2="474"/>
    <line x1="400" y1="466" x2="400" y2="474"/>
    <line x1="520" y1="466" x2="520" y2="474"/>
  </g>

  <!-- axis labels: structural only, no metrics -->
  <text x="60" y="505" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#777777" text-anchor="middle">FEATURE 1</text>
  <text x="30" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#777777" text-anchor="middle" transform="rotate(-90 30 250)">FEATURE 2</text>
  <text x="72" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#999999" class="model-label">MODEL</text>

  <!-- decision boundary -->
  <path d="M 60 400 C 200 380, 240 280, 340 260 C 440 240, 470 160, 600 120" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round" class="boundary"/>

  <!-- class A: filled points, upper-left -->
  <g fill="#171717" class="data-point">
    <circle cx="120" cy="140" r="4"/>
    <circle cx="150" cy="118" r="4"/>
    <circle cx="180" cy="150" r="4"/>
    <circle cx="140" cy="182" r="4"/>
    <circle cx="220" cy="172" r="4"/>
    <circle cx="170" cy="202" r="4"/>
    <circle cx="130" cy="222" r="4"/>
    <circle cx="250" cy="202" r="4"/>
    <circle cx="190" cy="242" r="4"/>
    <circle cx="240" cy="140" r="4"/>
  </g>

  <!-- class B: hollow points, lower-right -->
  <g fill="#FFFFFF" stroke="#666666" stroke-width="1.5" class="data-point">
    <circle cx="380" cy="322" r="4"/>
    <circle cx="420" cy="342" r="4"/>
    <circle cx="460" cy="312" r="4"/>
    <circle cx="400" cy="382" r="4"/>
    <circle cx="450" cy="392" r="4"/>
    <circle cx="500" cy="352" r="4"/>
    <circle cx="480" cy="422" r="4"/>
    <circle cx="530" cy="402" r="4"/>
    <circle cx="360" cy="432" r="4"/>
    <circle cx="552" cy="302" r="4"/>
  </g>

  <!-- highlighted observation: single accent ring, no metric claim -->
  <circle cx="200" cy="130" r="10" fill="none" stroke="#2563EB" stroke-width="1.5" class="node"/>
  <circle cx="200" cy="130" r="2.5" fill="#2563EB"/>
  <line x1="210" y1="122" x2="248" y2="96" stroke="#B8B8B8" stroke-width="0.75" class="annotation-line"/>
  <text x="252" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#666666" class="annotation">OBSERVATION</text>

  <!-- boundary annotation -->
  <line x1="344" y1="262" x2="344" y2="288" stroke="#B8B8B8" stroke-width="0.75" class="annotation-line"/>
  <text x="344" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#666666" text-anchor="middle" class="annotation">BOUNDARY</text>

  <!-- dataset annotation -->
  <text x="470" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#999999" class="annotation">DATASET · 2 CLASSES</text>
</svg>
